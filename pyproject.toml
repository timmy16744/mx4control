[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mx4control"
version = "1.0.0"
description = "GTK4/Libadwaita configuration app for Logitech MX Master 4 mouse"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "MX4Control Team"}
]
keywords = ["logitech", "mx-master-4", "mouse", "configuration", "gtk4", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: System :: Hardware",
]
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
    "hidapi>=0.14.0",
    "evdev>=1.6.0",
    "dbus-python>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/mx4control/mx4control"
Repository = "https://github.com/mx4control/mx4control"
Issues = "https://github.com/mx4control/mx4control/issues"

[project.scripts]
mx4control = "main:main"

[project.gui-scripts]
mx4control-gui = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["core", "ui", "ui.pages", "ui.widgets", "ui.dialogs", "services"]

[tool.setuptools.package-data]
"*" = ["*.css", "*.ui", "*.svg", "*.png"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
