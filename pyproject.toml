[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mx4control"
version = "2.0.0"
description = "Logitech MX Master 4 configuration + Actions Ring for Linux/Wayland"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["logitech", "mx-master-4", "mouse", "hyprland", "wayland", "actions-ring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: System :: Hardware",
]
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
    "hidapi>=0.14.0",
    "evdev>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mx4d = "mx4.daemon.main:main"
mx4ctl = "mx4.cli.main:main"
mx4-settings = "mx4.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mx4" = ["../data/css/*.css", "../data/ui/*.ui", "../data/icons/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
