<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for mx4-sysd. Install to
  /usr/share/dbus-1/system.d/org.mx4control.System.conf

  Only root may own the name (the daemon runs as root). Any local user
  may call it and receive its signals — reachable even at the login
  greeter, which is the point of the split. Privileged mutations
  (host-switch, config writes) are intended to be polkit-gated in a
  later hardening pass; today the boundary is "local users only".
-->
<busconfig>
  <policy user="root">
    <allow own="org.mx4control.System"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.mx4control.System"/>
    <allow receive_sender="org.mx4control.System"/>
  </policy>
</busconfig>
